name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/check_public_api.py
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Independently verify canonical transcript
        run: node tests/verify_transcript.cjs
      - run: cargo bench --locked --bench transmission_benches -- --test
      - run: cargo run --locked --example session
      - name: Build and test Python bindings
        run: |
          python -m pip install maturin pytest
          maturin build --locked --release --features python --out dist
          python -m pip install dist/*.whl
          python -m pytest tests/test_python_bindings.py
  msrv-sha-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo test --locked --no-default-features
  demo-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag trax-demo .
      - run: docker run --rm trax-demo
