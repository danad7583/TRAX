[package]
name = "trax"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Authenticated genesis, continuous mirrored relationship history, and variable-length signed transmissions."
repository = "https://github.com/danad7583/TRAX"
keywords = ["trax", "agents", "security", "dag", "merkle"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["hash-blake3"]
hash-blake3 = ["dep:blake3"]
python = ["dep:pyo3", "dep:rand"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = { version = "0.2.2" }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
blake3 = { version = "1", optional = true }
sha2 = "0.10"
thiserror = "1"
rand = { version = "0.8", optional = true }
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }

[dev-dependencies]
hex = "0.4"
rand = "0.8"
criterion = "0.5"

[[bench]]
name = "transmission_benches"
harness = false
